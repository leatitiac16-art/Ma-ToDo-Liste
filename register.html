<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription — MaToDo Liste</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">

        <h1>MaToDo Liste</h1>
        <h2>Organisez votre journée à votre rythme, sans pression</h2>

        <div class="auth-card">
            <h3>Créer un compte</h3>

            <div class="champ">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="ton@email.com" />
            </div>

            <div class="champ">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" placeholder="••••••••" />
            </div>

            <p id="message-erreur" class="message-erreur" style="display:none;"></p>
            <p id="message-succes" class="message-succes" style="display:none;"></p>

            <button id="btn-register" class="btn-valider">Créer mon compte</button>

            <p class="auth-lien">
                Déjà un compte ? 
                <a href="login.html">Se connecter</a>
            </p>
        </div>

    </div>
    <script src="register.js"></script>
</body>
</html>
